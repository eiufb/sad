<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --azul-pro: #1a237e;
            --verde-exito: #00c853;
            --binance-yellow: #f3ba2f;
            --rojo-error: #ff1744;
            --naranja-alerta: #ff9100;
            --bg-glass: rgba(255, 255, 255, 0.12);
        }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&q=80') no-repeat center center fixed;
            background-size: cover;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .overlay {
            background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.8) 100%);
            min-height: 100vh; width: 100%; padding: 20px; box-sizing: border-box;
        }

        /* --- EFECTO CARGA (SKELETON) --- */
        .loading {
            animation: pulse 1.5s infinite ease-in-out;
            opacity: 0.5;
        }
        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 0.8; }
            100% { opacity: 0.4; }
        }

        /* --- BOTONES RÁPIDOS (CHIPS) --- */
        .chips-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 0;
            width: 100%;
            scrollbar-width: none; /* Ocultar scroll en Firefox */
        }
        .chips-container::-webkit-scrollbar { display: none; } /* Ocultar scroll en Chrome/Safari */
        
        .chip {
            background: rgba(255,255,255,0.15);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
            transition: 0.2s;
        }
        .chip:active { background: var(--binance-yellow); color: black; transform: scale(0.95); }

        .status-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            position: relative;
        }

        .progress-ring { transform: rotate(-90deg); }
        .progress-ring__circle { transition: stroke-dashoffset 0.35s; transform-origin: 50% 50%; }
        .percentage-text { position: absolute; text-align: center; font-size: 24px; font-weight: bold; }

        .radar-fugas {
            background: var(--bg-glass);
            border-radius: 20px;
            padding: 15px;
            margin: 15px 0;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .bar-container { background: rgba(255,255,255,0.1); border-radius: 10px; height: 12px; margin: 10px 0; overflow: hidden; }
        .bar-fill { height: 100%; transition: 0.5s; width: 0%; }

        .cofres-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .cofre-card { background: rgba(255,215,0,0.1); border: 1px solid var(--binance-yellow); border-radius: 15px; padding: 10px; text-align: center; }

        .deudas-section { background: rgba(255,23,68,0.1); border-radius: 15px; padding: 15px; margin: 15px 0; border-left: 4px solid var(--rojo-error); }

        .card {
            background: var(--bg-glass);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px 0 rgba(0,0,0,0.3);
        }

        .suggestions {
            background: linear-gradient(90deg, #1a237e, #311b92);
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid var(--binance-yellow);
        }

        input, select {
            width: 100%; padding: 15px; margin: 8px 0; border-radius: 12px;
            border: none; background: rgba(255,255,255,0.9); font-size: 16px; box-sizing: border-box;
        }

        .btn-main { background: var(--verde-exito); color: white; width: 100%; margin-top: 10px; font-weight: bold; border: none; padding: 15px; border-radius: 12px; cursor: pointer; }
        .recent-moves { background: var(--bg-glass); border-radius: 20px; padding: 15px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="overlay">
        <h2>Hola, Papá 👋</h2>

        <div class="suggestions" id="ai-suggestion">
            <span>💡</span>
            <small id="text-sug">Sincronizando datos reales...</small>
        </div>
        
        <div class="status-container">
            <svg class="progress-ring" width="160" height="160">
                <circle stroke="rgba(255,255,255,0.1)" stroke-width="12" fill="transparent" r="70" cx="80" cy="80"/>
                <circle id="progress-bar" stroke="var(--verde-exito)" stroke-width="12" stroke-dasharray="440 440" style="stroke-dashoffset: 440;" fill="transparent" r="70" cx="80" cy="80" class="progress-ring__circle"/>
            </svg>
            <div class="percentage-text">
                <span id="global-val" class="loading">...</span><br>
                <small style="font-size: 12px; color: #ccc;">TOTAL USDT</small>
            </div>
        </div>

        <div class="radar-fugas">
            <small>📊 Radar de Fugas (Necesario vs Variable)</small>
            <div style="display:flex; justify-content:space-between; font-size:10px; margin-top:10px;">
                <span>Fijo</span>
                <span id="val-fijo">0%</span>
            </div>
            <div class="bar-container"><div id="bar-fijo" class="bar-fill" style="background: var(--verde-exito);"></div></div>
            
            <div style="display:flex; justify-content:space-between; font-size:10px;">
                <span>Variable</span>
                <span id="val-variable">0%</span>
            </div>
            <div class="bar-container"><div id="bar-variable" class="bar-fill" style="background: var(--naranja-alerta);"></div></div>
        </div>

        <div class="cofres-grid">
            <div class="cofre-card">
                <small>🍼 Futuro Hijo</small>
                <div class="bar-container" style="height:6px;"><div id="bar-hijo" class="bar-fill" style="background: var(--binance-yellow);"></div></div>
                <small id="txt-hijo" style="font-size:9px;">0%</small>
            </div>
            <div class="cofre-card">
                <small>🛡️ Emergencia</small>
                <div class="bar-container" style="height:6px;"><div id="bar-emer" class="bar-fill" style="background: var(--verde-exito);"></div></div>
                <small id="txt-emer" style="font-size:9px;">0%</small>
            </div>
        </div>

        <div class="deudas-section">
            <small>💸 Cuentas Pendientes</small>
            <div id="lista-deudas" style="font-size: 12px; margin-top:5px;">
                <div style="display:flex; justify-content:space-between;">
                    <span>Me deben (Cobrar)</span>
                    <span id="val-deuda" class="loading" style="color:var(--verde-exito)">$0</span>
                </div>
            </div>
        </div>

        <div class="dashboard">
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
                <div class="card">🇨🇴 <br> <small id="val-cop" class="loading">$0</small></div>
                <div class="card">🇦🇷 <br> <small id="val-ars" class="loading">$0</small></div>
                <div class="card">🔶 <br> <small id="val-bin" class="loading">0</small></div>
            </div>
        </div>

        <div class="form-container" style="margin-top: 20px;">
            <div class="chips-container">
                <div class="chip" onclick="setCat('Hijo')">🍼 Hijo</div>
                <div class="chip" onclick="setCat('Hogar')">🏠 Hogar</div>
                <div class="chip" onclick="setCat('Ocio')">🍔 Ocio</div>
                <div class="chip" onclick="setCat('Transp')">🚗 Transp</div>
                <div class="chip" onclick="setCat('Emergencia')">🛡️ Emergen.</div>
            </div>

            <input type="text" id="desc" placeholder="¿Qué compraste?">
            <input type="text" id="cat" placeholder="Categoría">
            <input type="number" id="monto" placeholder="Monto">
            <select id="tipo-mov">
                <option value="gasto">🔻 Gasto</option>
                <option value="ingreso">🔺 Ingreso</option>
                <option value="prestamo">🤝 Presté</option>
            </select>
            
            <button class="btn-main" onclick="registrar()">ENVIAR A SHEETS</button>
        </div>

        <div class="recent-moves">
            <h4>Últimos Movimientos</h4>
            <div id="historial" style="max-height: 150px; overflow-y: auto; font-size:12px;">
                Cargando...
            </div>
        </div>
    </div>

    <script>
        // --- FUNCIÓN PARA CHIPS RÁPIDOS ---
        function setCat(valor) {
            document.getElementById('cat').value = valor;
        }

        window.onload = function() {
            actualizarDesdeSheets();
        };

        function actualizarDesdeSheets() {
            // Añadimos clase de carga
            const elements = document.querySelectorAll('.loading');
            elements.forEach(el => el.classList.add('loading'));

            google.script.run.withSuccessHandler(function(datos) {
                // Quitar clase de carga
                elements.forEach(el => el.classList.remove('loading'));

                document.getElementById('global-val').innerText = datos.totalGlobal;
                document.getElementById('val-cop').innerText = datos.cop;
                document.getElementById('val-ars').innerText = datos.ars;
                document.getElementById('val-bin').innerText = datos.binance;
                document.getElementById('val-deuda').innerText = datos.deudas;
                
                renderBar('bar-fijo', 'val-fijo', datos.percFijo);
                renderBar('bar-variable', 'val-variable', datos.percVar);
                renderBar('bar-hijo', 'txt-hijo', datos.percHijo);
                renderBar('bar-emer', 'txt-emer', datos.percEmer);
                
                const circulo = document.getElementById('progress-bar');
                const offset = 440 - (440 * (datos.percFijo / 100));
                circulo.style.strokeDashoffset = offset;

                document.getElementById('historial').innerHTML = datos.historialHTML;
                document.getElementById('text-sug').innerText = datos.sugerencia;

            }).obtenerDatosRealTime();
        }

        function renderBar(idBar, idTxt, valor) {
            const v = Math.min(valor, 100); // Para que no se salga de la barra
            document.getElementById(idBar).style.width = v + "%";
            document.getElementById(idTxt).innerText = Math.round(valor) + "%";
        }

        function registrar() {
            const data = {
                desc: document.getElementById('desc').value,
                cat: document.getElementById('cat').value,
                monto: document.getElementById('monto').value,
                tipo: document.getElementById('tipo-mov').value
            };

            if(!data.monto || !data.desc) return alert("Por favor completa los datos.");

            // Botón en estado "enviando"
            const btn = document.querySelector('.btn-main');
            btn.innerText = "ENVIANDO...";
            btn.disabled = true;

            google.script.run.withSuccessHandler(function() {
                btn.innerText = "ENVIAR A SHEETS";
                btn.disabled = false;
                actualizarDesdeSheets(); 
                document.getElementById('desc').value = "";
                document.getElementById('monto').value = "";
                document.getElementById('cat').value = "";
            }).guardarMovimiento(data);
        }
    </script>
</body>
</html>
